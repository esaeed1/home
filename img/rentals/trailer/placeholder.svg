<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="8 by 12 utility trailer illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fc"/>
      <stop offset="1" stop-color="#dbe9fb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- ground line -->
  <line x1="60" y1="470" x2="740" y2="470" stroke="#b9cbe4" stroke-width="2"/>

  <!-- trailer bed -->
  <rect x="180" y="300" width="420" height="120" rx="6" fill="#0A74DA"/>
  <rect x="180" y="300" width="420" height="120" rx="6" fill="none" stroke="#06407f" stroke-width="4"/>

  <!-- mesh side rails -->
  <g stroke="#06407f" stroke-width="4">
    <line x1="200" y1="300" x2="200" y2="230"/>
    <line x1="260" y1="300" x2="260" y2="230"/>
    <line x1="320" y1="300" x2="320" y2="230"/>
    <line x1="380" y1="300" x2="380" y2="230"/>
    <line x1="440" y1="300" x2="440" y2="230"/>
    <line x1="500" y1="300" x2="500" y2="230"/>
    <line x1="560" y1="300" x2="560" y2="230"/>
    <line x1="600" y1="300" x2="600" y2="230"/>
    <line x1="200" y1="230" x2="600" y2="230"/>
    <line x1="200" y1="265" x2="600" y2="265"/>
  </g>

  <!-- tongue/hitch -->
  <path d="M180 380 L90 400" stroke="#06407f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="400" r="10" fill="#06407f"/>

  <!-- wheel -->
  <circle cx="420" cy="440" r="42" fill="#26313f"/>
  <circle cx="420" cy="440" r="16" fill="#c9d3de"/>

  <!-- toolbox -->
  <rect x="210" y="405" width="70" height="35" rx="4" fill="#06407f"/>

  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0A2E5C">8 &#215; 12 Utility Trailer</text>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3c5c85">Photo coming soon</text>
</svg>
