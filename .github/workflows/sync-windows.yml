name: Sync windows from Marketplace

on:
  schedule:
    # Daily at 1pm America/New_York. GitHub Actions cron only runs on fixed
    # UTC, it doesn't track DST -- 17:00 UTC is 1pm during Eastern Daylight
    # Time (roughly mid-March to early November). During Eastern Standard
    # Time (winter), this will fire at 12pm instead of 1pm. If that matters,
    # change to 18:00 for the winter half of the year and back for summer.
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/sync-windows.mjs

      - name: Commit updated photos, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/windows/
          git diff --cached --quiet || git commit -m "Sync window photos from Marketplace [skip ci]"
          git push
